name: Deploy CampusKit to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify public site
        run: |
          for attempt in {1..12}; do
            if curl --fail --silent --show-error --location --max-time 20 "${{ steps.deployment.outputs.page_url }}" | grep -q 'CampusKit'; then
              echo "CampusKit is reachable at ${{ steps.deployment.outputs.page_url }}"
              exit 0
            fi
            sleep 10
          done
          echo "CampusKit could not be reached after deployment" >&2
          exit 1
